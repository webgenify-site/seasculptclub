<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bookings | Sea Sculpt Club</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--navy:#12314F;--soft:#4A6683;--line:rgba(18,49,79,.12);--pale:#EEF5FC;--butter:#FFE9A6;--warn:#A2401B;}
  *{box-sizing:border-box;}
  body{margin:0;background:#F7FAFD;color:var(--navy);font:400 15px/1.5 'Jost',system-ui,sans-serif;}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;background:#fff;border-bottom:1px solid var(--line);}
  header img{height:46px;}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:500;margin:0;}
  main{max-width:1240px;margin:0 auto;padding:28px;}
  button,select,input{font:inherit;}
  .btn{min-height:40px;padding:0 18px;border:1px solid var(--navy);border-radius:999px;background:#fff;color:var(--navy);cursor:pointer;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;}
  .btn.fill{background:var(--navy);color:#fff;}
  .btn:disabled{opacity:.5;cursor:default;}
  .login{max-width:380px;margin:12vh auto;padding:32px;background:#fff;border:1px solid var(--line);border-radius:12px;}
  .login h1{font-size:2rem;margin-bottom:6px;}
  .login label{display:block;margin:18px 0 6px;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);}
  .login input{width:100%;min-height:44px;padding:0 14px;border:1px solid rgba(18,49,79,.25);border-radius:6px;margin-bottom:16px;}
  .err{color:var(--warn);font-size:.9rem;margin:10px 0 0;}
  .err:empty{display:none;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tabs button{border-radius:999px;border:1px solid var(--line);background:#fff;padding:8px 16px;cursor:pointer;color:var(--navy);}
  .tabs button[aria-selected="true"]{background:var(--navy);color:#fff;border-color:var(--navy);}
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:22px;}
  .toolbar select{min-height:40px;padding:0 12px;border:1px solid rgba(18,49,79,.25);border-radius:6px;background:#fff;color:var(--navy);}
  .toolbar label{font-size:.85rem;color:var(--soft);display:flex;gap:6px;align-items:center;}
  .spacer{flex:1;}
  .note{background:var(--pale);border-radius:8px;padding:12px 16px;margin:0 0 18px;font-size:.9rem;color:var(--soft);}
  .group{margin:0 0 30px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .group-head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:16px 20px;border-bottom:1px solid var(--line);}
  .group-head h2{font-size:1.45rem;}
  .group-head .meta{color:var(--soft);font-size:.9rem;}
  .group-head .count{margin-left:auto;font-weight:500;}
  .scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:.88rem;}
  th{text-align:left;font-weight:500;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);padding:10px 14px;background:#FAFCFE;white-space:nowrap;}
  td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top;}
  td.mono{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;word-break:break-all;min-width:160px;}
  a.ref{color:var(--navy);}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;background:#E5F3EA;color:#1E6B3A;white-space:nowrap;}
  .pill.test{background:var(--butter);color:var(--navy);}
  .pill.check{background:#FBE7DF;color:var(--warn);}
  .flags{margin:6px 0 0;padding:0;list-style:none;color:var(--warn);font-size:.8rem;}
  .notes{color:var(--soft);font-size:.8rem;margin-top:4px;}
  .empty{padding:40px;text-align:center;color:var(--soft);background:#fff;border:1px dashed var(--line);border-radius:12px;}
  @media(max-width:700px){main{padding:16px;} header{padding:14px 16px;}}
  [hidden]{display:none !important;}
  .intake-flag{margin-top:6px;padding:6px 8px;border-radius:6px;background:#FFF4E5;color:#8A4B12;font-size:.8rem;line-height:1.4;}
  .roster{margin-bottom:22px}
  .roster-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:16px 18px 10px}
  .roster-head h2{margin:0;font-size:1.25rem}
  .roster-head p{margin:4px 0 0;color:#4A6683;font-size:.9rem}
  .roster-count{text-align:right;font-size:.9rem;color:#4A6683;white-space:nowrap}
  .roster-count strong{display:block;font-size:2rem;line-height:1;color:#12314F}
  .roster.is-past{opacity:.6}
  #memberSearch{padding:8px 12px;border:1px solid rgba(18,49,79,.3);border-radius:8px;font:inherit;min-width:240px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 18px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .kpi .k{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);}
  .kpi .v{font:500 2rem/1.15 'Cormorant Garamond',serif;margin-top:4px;}
  .kpi .d{font-size:.8rem;color:var(--soft);margin-top:2px;}
  .kpi .d.up{color:#1E6B3A;} .kpi .d.down{color:var(--warn);}
  .sales-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:18px;}
  @media(max-width:900px){.sales-grid{grid-template-columns:1fr;}}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .panel h2{font-size:1.35rem;margin:0 0 2px;} .panel .sub{color:var(--soft);font-size:.85rem;margin:0 0 12px;}
  .chart{position:relative;} .chart svg{display:block;width:100%;height:220px;overflow:visible;}
  .chart .tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;border-radius:6px;padding:6px 9px;font-size:.78rem;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .1s;}
  .hbar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:.88rem;}
  .hbar:first-of-type{border-top:0;}
  .hbar .track{display:block;height:10px;background:#EEF3F8;border-radius:5px;overflow:hidden;} .hbar .fill{display:block;height:100%;background:var(--navy);border-radius:0 5px 5px 0;}
  .hbar .amt{text-align:right;white-space:nowrap;} .hbar .amt small{display:block;color:var(--soft);font-size:.75rem;}
  .num{text-align:right;white-space:nowrap;}
  .vm-tag{display:inline-block;background:#008CFF;color:#fff;border-radius:4px;padding:1px 6px;font:600 .7rem system-ui,sans-serif;}
  .pp-tag{display:inline-block;background:#FFC439;color:#003087;border-radius:4px;padding:1px 6px;font:600 .7rem system-ui,sans-serif;}
</style>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sea Sculpt Club">
<meta property="og:url" content="https://seasculptclub.com/bookings">
<meta property="og:title" content="Bookings | Sea Sculpt Club">
<meta property="og:description" content="Pilates sculpt classes, private training and parties at the Jersey Shore, NJ.">
<meta property="og:image" content="https://seasculptclub.com/assets/og-home.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Sea Sculpt Club — Themed experiences, beach at sunset">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<header>
  <img src="assets/logo.png" alt="Sea Sculpt Club">
  <button class="btn" id="logout" hidden>Log out</button>
</header>

<section class="login" id="loginBox">
  <h1>Bookings</h1>
  <p style="color:var(--soft);margin:0">Enter the admin password to view attendees.</p>
  <form id="loginForm">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn fill" type="submit" style="width:100%">View bookings</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</section>

<main id="app" hidden>
  <div class="tabs" role="tablist">
    <button role="tab" data-view="rosters" aria-selected="true">Class rosters</button>
    <button role="tab" data-view="sales" aria-selected="false">Sales</button>
    <button role="tab" data-view="bookings" aria-selected="false">Bookings</button>
    <button role="tab" data-view="members" aria-selected="false">Members</button>
    <button role="tab" data-view="recovered" aria-selected="false">Past payments (before booking records)</button>
    <button role="tab" data-view="giftcards" aria-selected="false">eGift &amp; class codes</button>
    <button role="tab" data-view="forms" aria-selected="false">Form messages</button>
  </div>
  <div class="toolbar">
    <select id="classFilter" aria-label="Filter by class and date"><option value="">All classes and dates</option></select>
    <label><input type="checkbox" id="showTest"> Show test-mode bookings</label>
    <label id="checkOnlyWrap" hidden><input type="checkbox" id="checkOnly"> Only ones that need checking</label>
    <label id="showPastRosterWrap" hidden><input type="checkbox" id="showPastRoster"> Show past classes</label>
    <span id="salesCtl" hidden style="display:contents">
      <select id="salesRange" aria-label="Sales period"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="month">This month</option><option value="lastmonth">Last month</option><option value="year">This year</option><option value="all">All time</option></select>
      <label><input type="checkbox" id="salesPast" checked> Include earlier Stripe payments</label>
      <label><input type="checkbox" id="salesHideOwn" checked> Hide my own test purchases</label>
    </span>
    <input type="search" id="memberSearch" placeholder="Search name, email or phone" aria-label="Search members" hidden>
    <span class="spacer"></span>
    <button class="btn" id="refresh">Refresh</button>
    <button class="btn fill" id="csv">Download CSV</button>
  </div>
  <p class="note" id="viewNote"></p>
  <p class="err" id="appErr" role="alert"></p>
  <div id="list"></div>
</main>

<script>
(function () {
  var API = "/api/admin-bookings";
  var PW_KEY = "sscAdminPw";
  var view = "bookings", data = { bookings: null, recovered: null, forms: null, giftcards: null };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var money = function (c) { return c == null ? "" : "$" + (c / 100).toFixed(2); };
  function pw() { try { return sessionStorage.getItem(PW_KEY) || ""; } catch (e) { return ""; } }

  function call(params) {
    return fetch(API + "?" + new URLSearchParams(params), { headers: { "x-admin-password": pw() }, cache: "no-store" });
  }
  function load(v, force) {
    if (v === "rosters" || v === "sales") return load("bookings", force);
    if (data[v] && !force) return Promise.resolve(data[v]);
    $("appErr").textContent = ""; $("list").innerHTML = '<p class="note">Loading…</p>';
    return call({ view: v }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (r.status === 401) { logout("Wrong password."); throw new Error("auth"); }
        if (!r.ok) throw new Error(d.error || "Couldn't load bookings.");
        data[v] = d.records || []; return data[v];
      });
    });
  }

  // eGift rows: recipient, code, when it sends, and whether it went out.
  function giftCell(gifts) {
    var label = { scheduled: "scheduled", sent: "sent", failed: "failed, retrying", not_sent: "not sent: email it by hand" };
    return gifts.map(function (g) {
      return '<div style="margin-bottom:8px"><strong>For ' + esc(g.toName) + '</strong> &lt;' + esc(g.toEmail) + '&gt;<br>' +
        '<small>Code <span class="mono">' + esc(g.code || "?") + '</span> · ' + (g.sendOn === "now" ? "send now" : "sends " + esc(g.sendOn)) +
        ' · ' + esc(label[g.status] || g.status || "") + '</small>' + (g.message ? '<br><small>&ldquo;' + esc(g.message) + '&rdquo;</small>' : "") + '</div>';
    }).join("");
  }
  // Checkout answers: how they heard about us, injuries/modifications, photo consent, waiver.
  function intakeCell(q) {
    if (!q) return "";
    var bits = [];
    if (q.injuries) bits.push('<div class="intake-flag">&#9888; Injuries / modifications: ' + esc(q.injuries) + '</div>');
    if (q.photoConsent) bits.push('<div class="notes">Photos: ' + (q.photoConsent === "yes" ? "OK" : "<strong>No photos</strong>") + '</div>');
    if (q.heard) bits.push('<div class="notes">Heard about us: ' + esc(q.heard + (q.heardOther ? ": " + q.heardOther : "")) + '</div>');
    if (q.waiver) bits.push('<div class="notes">Waiver agreed ' + esc(new Date(q.waiver.at).toLocaleString()) + '</div>');
    if (q.cancelPolicy) bits.push('<div class="notes">Cancellation policy agreed ' + esc(new Date(q.cancelPolicy.at).toLocaleString()) + '</div>');
    return bits.join("");
  }
  function payTag(r) {
    if (r.provider === "paypal") return r.paymentMethod === "venmo" ? '<span class="vm-tag">Venmo</span>' : '<span class="pp-tag">PayPal</span>';
    return "";
  }
  function methodOf(r) {
    if (r.provider === "paypal") return r.paymentMethod === "venmo" ? "Venmo" : "PayPal";
    if (!r.amountTotal) return r.giftRedemption ? "Code only" : "Free";
    return "Card (Stripe)";
  }
  // ---------- Sales dashboard ----------
  var salesPastLoading = false;
  function etDay(iso) { try { return new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" }).format(new Date(iso)); } catch (e) { return String(iso).slice(0, 10); } }
  function addDays(day, n) { var d = new Date(day + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function salesWindow(sel, today) {
    var y = today.slice(0, 4), m = today.slice(5, 7);
    if (sel === "all") return { from: "0000-01-01", to: today, label: "all time" };
    if (sel === "month") return { from: y + "-" + m + "-01", to: today, label: "this month" };
    if (sel === "year") return { from: y + "-01-01", to: today, label: "this year" };
    if (sel === "lastmonth") { var first = y + "-" + m + "-01", end = addDays(first, -1); return { from: end.slice(0, 8) + "01", to: end, label: "last month" }; }
    var n = +sel; return { from: addDays(today, -(n - 1)), to: today, label: "last " + n + " days" };
  }
  function prevWindow(w) {
    if (w.from === "0000-01-01") return null;
    var days = Math.round((new Date(w.to + "T12:00:00Z") - new Date(w.from + "T12:00:00Z")) / 864e5) + 1;
    return { from: addDays(w.from, -days), to: addDays(w.from, -1) };
  }
  // One row per paid order, with what it paid, what was refunded, and how it split across items.
  function salesRows() {
    var hideOwn = $("salesHideOwn").checked, rows = [];
    var src = (data.bookings || []).concat($("salesPast").checked && data.recovered ? data.recovered : []);
    src.forEach(function (r) {
      if (r.livemode === false || r.status !== "paid") return;
      var email = String(r.purchaser && r.purchaser.email || "").toLowerCase();
      if (hideOwn && email === "seasculptclub@gmail.com") return;
      var items = r.items || [], paid = r.amountTotal || 0;
      var weights = items.map(function (it) { return Math.max(0, (it.unitAmount || 0) * (+it.spots || 1)); });
      var wsum = weights.reduce(function (a, b) { return a + b; }, 0);
      var parts = items.map(function (it, i) {
        var share = wsum ? Math.round(paid * weights[i] / wsum) : (i === 0 ? paid : 0);
        var ref = it.cancelled && it.cancelled.refund && it.cancelled.refund.status !== "failed" ? it.cancelled.refund.amount || 0 : 0;
        return { it: it, gross: share, refund: ref };
      });
      var refund = r.refundedAmount != null ? r.refundedAmount : parts.reduce(function (a, p) { return a + p.refund; }, 0);
      rows.push({ r: r, day: etDay(r.paidAt || r.createdAt), gross: paid, refund: refund, method: methodOf(r), parts: parts });
    });
    return rows;
  }
  function sumWin(rows, w) {
    var o = { gross: 0, refund: 0, orders: 0, spots: 0 };
    rows.forEach(function (x) {
      if (x.day < w.from || x.day > w.to) return;
      o.gross += x.gross; o.refund += x.refund; if (x.gross > 0) o.orders++;
      x.parts.forEach(function (p) { if (!p.it.cancelled && (p.it.kind === "class" || (p.it.date && p.it.kind !== "gift" && p.it.kind !== "pack"))) o.spots += +p.it.spots || 0; });
    });
    o.net = o.gross - o.refund; o.avg = o.orders ? Math.round(o.gross / o.orders) : 0;
    return o;
  }
  function delta(cur, prev, isMoney) {
    if (prev == null) return "";
    if (!prev) return cur ? '<div class="d up">new this period</div>' : '<div class="d">same as before</div>';
    var pct = Math.round((cur - prev) / prev * 100);
    return '<div class="d ' + (pct > 0 ? "up" : pct < 0 ? "down" : "") + '">' + (pct > 0 ? "&#9650; " : pct < 0 ? "&#9660; " : "") + Math.abs(pct) + '% vs previous (' + (isMoney ? money(prev) : prev) + ')</div>';
  }
  function kindLabel(it) {
    if (it.kind === "gift") return "eGift cards"; if (it.kind === "pack") return "Class packs";
    if (it.kind === "class" || it.date) return "Classes & events"; return "Other";
  }
  function renderSales() {
    if ($("salesPast").checked && !data.recovered && !salesPastLoading) {
      salesPastLoading = true;
      load("recovered").then(function () { salesPastLoading = false; if (view === "sales") renderSales(); })
        .catch(function (e) { salesPastLoading = false; data.recovered = []; if (e.message !== "auth") $("appErr").textContent = "Earlier Stripe payments couldn't load: " + e.message; if (view === "sales") renderSales(); });
    }
    var today = todayET(), w = salesWindow($("salesRange").value, today), pw0 = prevWindow(w);
    var rows = salesRows(), cur = sumWin(rows, w), prev = pw0 ? sumWin(rows, pw0) : null;
    var inWin = rows.filter(function (x) { return x.day >= w.from && x.day <= w.to; });
    var html = salesPastLoading ? '<p class="note">Loading earlier Stripe payments… the numbers below will update.</p>' : "";
    html += '<div class="kpis">' +
      '<div class="kpi"><div class="k">Net sales</div><div class="v">' + money(cur.net) + '</div>' + delta(cur.net, prev && prev.net, true) + '</div>' +
      '<div class="kpi"><div class="k">Orders</div><div class="v">' + cur.orders + '</div>' + delta(cur.orders, prev && prev.orders) + '</div>' +
      '<div class="kpi"><div class="k">Class spots sold</div><div class="v">' + cur.spots + '</div>' + delta(cur.spots, prev && prev.spots) + '</div>' +
      '<div class="kpi"><div class="k">Average order</div><div class="v">' + money(cur.avg) + '</div>' + delta(cur.avg, prev && prev.avg, true) + '</div>' +
      '<div class="kpi"><div class="k">Refunds</div><div class="v">' + money(cur.refund) + '</div><div class="d">gross sales ' + money(cur.gross) + '</div></div>' +
      '</div>';
    // Daily chart: last 30 days of the window (or the whole window if shorter).
    var start = w.from === "0000-01-01" ? (inWin.length ? inWin.map(function (x) { return x.day; }).sort()[0] : addDays(today, -29)) : w.from;
    var days = [], byDay = {};
    inWin.forEach(function (x) { byDay[x.day] = byDay[x.day] || { net: 0, orders: 0 }; byDay[x.day].net += x.gross - x.refund; if (x.gross > 0) byDay[x.day].orders++; });
    var monthly = (new Date(w.to + "T12:00:00Z") - new Date(start + "T12:00:00Z")) / 864e5 > 92, buckets = [];
    if (monthly) {
      var bm = {}; inWin.forEach(function (x) { var k = x.day.slice(0, 7); bm[k] = bm[k] || { net: 0, orders: 0 }; bm[k].net += x.gross - x.refund; if (x.gross > 0) bm[k].orders++; });
      for (var mk = start.slice(0, 7); mk <= w.to.slice(0, 7); ) { buckets.push({ key: mk, label: new Date(mk + "-15T12:00:00Z").toLocaleDateString("en-US", { month: "short", year: "2-digit" }), v: bm[mk] || { net: 0, orders: 0 } }); var nx = new Date(mk + "-15T12:00:00Z"); nx.setUTCMonth(nx.getUTCMonth() + 1); mk = nx.toISOString().slice(0, 7); }
    } else {
      for (var d = start; d <= w.to; d = addDays(d, 1)) buckets.push({ key: d, label: new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric" }), v: byDay[d] || { net: 0, orders: 0 } });
    }
    var max = Math.max.apply(null, buckets.map(function (b) { return b.v.net; }).concat([100]));
    var W = 640, H = 220, padL = 46, padB = 24, n = buckets.length, slot = (W - padL) / Math.max(n, 1), bw = Math.max(2, Math.min(28, slot - 2));
    var step = Math.pow(10, Math.floor(Math.log10(max / 100))) * 100, ticks = [];
    var nice = [1, 2, 2.5, 5, 10].map(function (f) { return f * step; }).filter(function (t) { return max / t <= 4; })[0] || step * 10;
    for (var t = 0; ; t += nice) { ticks.push(t); if (t >= max) break; }
    var top = ticks[ticks.length - 1] || max, y = function (v) { return (H - padB) - (v / top) * (H - padB - 8); };

            '<td>' + esc(r.purchaser.email) + '</td><td>' + esc(r.purchaser.phone || "") + '</td><td>' + esc(x.it.spots) + '</td>' +
            '<td>' + status + '</td>' +
            '<td class="mono">' + (r.provider === "paypal" ? payTag(r) + ' ' + esc(r.transactionId || r.paypalCaptureId || "") + (r.livemode === false ? ' <small>(sandbox)</small>' : "") : refUrl ? '<a class="ref" href="' + refUrl + '" target="_blank" rel="noopener">' + esc(r.paymentIntent) + '</a>' : esc(r.sessionId)) + '</td>' +
            '<td>' + esc(new Date(r.paidAt || r.createdAt).toLocaleString()) + '</td></tr>';
        }).join("") + '</tbody></table></div></section>';
    }).join("");
  }

  function switchView(v) {
    view = v;
    document.querySelectorAll(".tabs button").forEach(function (b) { b.setAttribute("aria-selected", String(b.getAttribute("data-view") === v)); });
    $("checkOnlyWrap").hidden = v !== "recovered";
    var simple = v === "forms" || v === "giftcards" || v === "rosters" || v === "members" || v === "sales";
    $("salesCtl").hidden = v !== "sales"; $("csv").hidden = v === "sales";
    $("classFilter").hidden = simple; $("showTest").parentNode.hidden = simple;
    $("showPastRosterWrap").hidden = v !== "rosters"; $("memberSearch").hidden = v !== "members";
    $("viewNote").textContent = v === "sales"
      ? "Live sales from your website: card (Stripe), PayPal and Venmo, updated the moment each payment goes through. Refunds made from customers' account cancellations are subtracted. Refunds you issue by hand in Stripe or PayPal aren't included."
      : v === "rosters"
      ? "Who's coming to each class, soonest first. Names come from checkout (Me / Friend). Injury notes, photo preferences and emergency contacts come from the person who booked."
      : v === "members"
      ? "Everyone with a Sea Sculpt Club account, plus customers who booked as guests. Passwords are never shown or stored in readable form."
      : v === "giftcards"
      ? "Every eGift code and BOGO class code sold on the website. Each credit covers one class spot worth up to $35 (customers pay the difference for premium events); leftover credits stay on the code."
      : v === "forms"
      ? "Newsletter signups and messages sent through the website, newest first. Each one is also emailed to you once email is set up."
      : v === "bookings"
      ? "Confirmed bookings from card (Stripe), PayPal and Venmo, saved automatically when each payment is confirmed."
      : "Paid Stripe payments from before booking records existed, matched to classes by their Stripe price. Ones marked “check” couldn’t be matched with confidence. This list is read live from Stripe and isn’t stored.";
    load(v).then(render).catch(function (e) { if (e.message !== "auth") { $("list").innerHTML = ""; $("appErr").textContent = e.message; } });
  }

  function downloadCsv() {
    $("csv").disabled = true;
    call({ view: view, format: "csv" }).then(function (r) {
      if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || "Download failed."); });
      return r.blob().then(function (b) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = view === "members" ? "sea-sculpt-members.csv" : view === "recovered" ? "sea-sculpt-past-payments.csv" : view === "forms" ? "sea-sculpt-form-messages.csv" : view === "giftcards" ? "sea-sculpt-egift-cards.csv" : "sea-sculpt-bookings.csv";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      });
    }).catch(function (e) { $("appErr").textContent = e.message; }).then(function () { $("csv").disabled = false; });
  }

  function showApp() { $("loginBox").hidden = true; $("app").hidden = false; $("logout").hidden = false; switchView("rosters"); }
  function logout(message) {
    try { sessionStorage.removeItem(PW_KEY); } catch (e) {}
    data = { bookings: null, recovered: null, forms: null };
    $("app").hidden = true; $("logout").hidden = true; $("loginBox").hidden = false;
    $("loginErr").textContent = message || ""; $("pw").value = ""; $("pw").focus();
  }

  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    try { sessionStorage.setItem(PW_KEY, $("pw").value); } catch (err) {}
    $("loginErr").textContent = "";
    call({ view: "bookings" }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) { logout(d.error || "Couldn't sign in."); return; }
        data.bookings = d.records || []; showApp();
      });
    }).catch(function () { logout("Couldn't reach the server."); });
  });
  $("logout").addEventListener("click", function () { logout(); });
  $("refresh").addEventListener("click", function () { load(view, true).then(render).catch(function (e) { if (e.message !== "auth") $("appErr").textContent = e.message; }); });
  $("csv").addEventListener("click", downloadCsv);
  $("classFilter").addEventListener("change", render);
  $("showTest").addEventListener("change", render);
  $("checkOnly").addEventListener("change", render);
  $("showPastRoster").addEventListener("change", render);
  ["salesRange", "salesPast", "salesHideOwn"].forEach(function (id) { $(id).addEventListener("change", render); });
  $("memberSearch").addEventListener("input", render);
  document.querySelectorAll(".tabs button").forEach(function (b) { b.addEventListener("click", function () { switchView(b.getAttribute("data-view")); }); });

  if (pw()) { call({ view: "bookings" }).then(function (r) { return r.json().then(function (d) { if (r.ok) { data.bookings = d.records; showApp(); } else logout(); }); }).catch(function () { logout(); }); }
})();
</script>
</body>
</html>
