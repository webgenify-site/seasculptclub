# Cloudflare Pages settings for seasculptclub.com (this file is the source of truth for these values).
# Secrets (Stripe keys, passwords, tokens) are NOT kept here: add them in Cloudflare →
# your Pages project → Settings → Variables and Secrets, as type "Secret".
name = "seasculptclub-website"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

# Bookings, form messages and eGift records
[[d1_databases]]
binding = "DB"
database_name = "sea-sculpt-bookings"
database_id = "60d8843a-2fb5-45af-8a65-d36026d91aca"

# Plain (non-secret) settings
[vars]
SITE_URL = "https://seasculptclub.com"
# Blog posts: Airtable base "Sea Sculpt Club Blog", table "Posts" (token is the AIRTABLE_TOKEN secret)
AIRTABLE_BASE_ID = "appha5EL7Q92l0yuf"
AIRTABLE_TABLE = "Posts"
BOOKING_EMAIL_FROM = "Sea Sculpt Club <bookings@seasculptclub.com>"

# ---- Preview deployments (e.g. the "sandbox" branch → sandbox.seasculptclub-website.pages.dev) ----
# Used for Stripe test-mode (sandbox) testing: its own database, so tests never mix with real bookings.
# Preview secrets (Stripe sk_test_/pk_test_ keys, test webhook secret, ADMIN_PASSWORD, RESEND_API_KEY)
# are added in Cloudflare → Settings → Variables and Secrets → Preview.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "sea-sculpt-bookings-sandbox"
database_id = "904aa218-ff7f-4d30-81ca-f394c933f4e2"

[env.preview.vars]
SITE_URL = "https://sandbox.seasculptclub-website.pages.dev"
# Stripe sandbox (test mode) prices, used only with sk_test_/pk_test_ keys
STRIPE_TEST_PRICE_IDS = '{"gift-2":"price_1UTp7J1UP4OSvubVWEUuCjb3","spooky-oct30":"price_1UTp7l1UP4OSvubVnSvTjPI1","intro-bogo":"price_1UTp811UP4OSvubVzllP8PsW","pack-3":"price_1UVW2L1UP4OSvubVjvR1o7UV"}'
AIRTABLE_BASE_ID = "appha5EL7Q92l0yuf"
AIRTABLE_TABLE = "Posts"
BOOKING_EMAIL_FROM = "Sea Sculpt Club <bookings@seasculptclub.com>"
